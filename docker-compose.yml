# Oraflow con Docker. Uso:  cp .env.example .env  →  edita .env  →  docker compose up -d
# El panel queda en http://localhost:3456 (solo en tu máquina).
services:
  oraflow:
    build: .
    container_name: oraflow
    env_file: .env
    environment:
      TZ: America/New_York            # cámbialo a tu zona horaria
    ports:
      - "127.0.0.1:3456:3456"         # solo localhost; para entrar desde fuera usa un túnel o un proxy con HTTPS
    volumes:
      - ./data:/app/data              # base de datos, vídeos y miniaturas
      - ./config:/app/config          # credenciales de YouTube (no se suben a git)
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./temp:/app/temp
    mem_limit: 2g
    restart: unless-stopped
